name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Show Windows PowerShell version
        run: $PSVersionTable.PSVersion.ToString()

      - name: Install Pester 6.2.0
        run: Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        run: |
          Import-Module Pester -RequiredVersion 6.2.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.Result -ne 'Passed') { throw "Pester result: $($result.Result), failed: $($result.FailedCount)" }
