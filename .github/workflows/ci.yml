name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

      - name: Publish Native AOT (win-x64)
        run: dotnet publish src/NexerAI.Cli -c Release -r win-x64 -o artifacts/publish

      - name: Smoke test the published exe
        shell: pwsh
        run: |
          & ./artifacts/publish/nexer-ai.exe --version
          if ($LASTEXITCODE -ne 0) { throw "nexer-ai --version exited with $LASTEXITCODE" }
